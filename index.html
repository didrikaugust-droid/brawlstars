<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Stars</title>

<style>
body{
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:linear-gradient(135deg,#ffcc00,#ff9900);
}

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

button{
    padding:12px 25px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.yes{
    background:#4CAF50;
    color:white;
}

.no{
    background:#f44336;
    color:white;
}
</style>
</head>
<body>

<div class="box">
    <h1>🎮 Vil du bli med å spille Brawl Stars?</h1>

    <button class="yes" onclick="window.location.href='booking.html'">
        Ja
    </button>

    <button class="no" onclick="showNo()">
        Nei
    </button>

    <div id="noMessage"></div>
</div>

<script>
function showNo(){
    document.getElementById("noMessage").innerHTML =
    "<h3>😢 Kanskje en annen gang!.</h3>";
}
</script>

</body>
</html>
