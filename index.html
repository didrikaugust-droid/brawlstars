<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Stars Invitasjon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffb300,#ff6f00);
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    max-width:800px;
    width:100%;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    margin-bottom:80px;
}

.hero-image{
    width:100%;
    border-radius:20px;
    margin-bottom:20px;
}

h1{
    margin-bottom:15px;
}

p{
    margin-bottom:20px;
}

.btn{
    border:none;
    padding:15px 30px;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    margin:10px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.yes{
    background:#22c55e;
    color:white;
}

.no{
    background:#ef4444;
    color:white;
}

.message{
    margin-top:20px;
    padding:20px;
    background:#f3f4f6;
    border-radius:15px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111827;
    display:flex;
    justify-content:space-around;
    padding:15px;
}

.bottom-nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="card">


    <img src="images/banner.jpg" class="hero-image" alt="brwal.png">

    <h1>🎮 Vil du bli med å spille Brawl Stars?</h1>

    <p>
        Velg dato, pakke og bli med på en episk spilløkt!
    </p>

    <button class="btn yes"
        onclick="window.location.href='booking.html'">
        JA 🚀
    </button>

    <button class="btn no"
        onclick="showNo()">
        NEI
    </button>

    <div id="noBox"></div>

</div>

<nav class="bottom-nav">
    <a href="index.html">🏠 Hjem</a>
    <a href="booking.html">📅 Book</a>
</nav>

<script>
function showNo() {
    document.getElementById("noBox").innerHTML = `
        <div class="message">
            <h3>😢 Er du sikker på at du ikke vil spille?</h3>
            <br>
            <button class="btn yes"
                onclick="document.getElementById('noBox').innerHTML=''">
                🎮 Gå tilbake
            </button>
        </div>
    `;
}
</script>

</body>
</html>
