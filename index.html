<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Stars Invitasjon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h1>🎮 Vil du bli med å spille Brawl Stars?</h1>
    <p>Velg et tidspunkt og bli med på en episk kamp!</p>

    <button class="btn yes" onclick="window.location.href='booking.html'">
        JA 🚀
    </button>

    <button class="btn no" onclick="showNo()">
        NEI
    </button>

    <div id="noBox"></div>
</div>

<script>
function showNo() {
    document.getElementById("noBox").innerHTML = `
        <div class="message">
            <h3>😢 Er du sikker?</h3>
            <button class="btn yes" onclick="document.getElementById('noBox').innerHTML=''">
                Gå tilbake
            </button>
        </div>
    `;
}
</script>

</body>
</html>
