/* ⭐ FAVORITTER */
function getFavs(){
    return JSON.parse(localStorage.getItem("favs") || "[]");
}

function toggleFav(name){
    let favs = getFavs();

    if(favs.includes(name)){
        favs = favs.filter(f => f !== name);
    } else {
        favs.push(name);
    }

    localStorage.setItem("favs", JSON.stringify(favs));
    render(brawlers);
}

/* 🎨 RENDER */
const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");

function render(list){
    const favs = getFavs();
    grid.innerHTML = "";

    list.forEach(b => {
        const div = document.createElement("div");
        div.className = "brawler-card rarity-" + b.rarity;

        const star = favs.includes(b.name) ? "⭐ " : "";

        div.innerHTML = `
            ${star}${b.name}
        `;

        div.onclick = () => {
            div.classList.add("clickAnim");

            setTimeout(() => {
                window.location.href = "brawler.html?name=" + encodeURIComponent(b.name);
            }, 150);
        };

        /* right click = favorite */
        div.oncontextmenu = (e) => {
            e.preventDefault();
            toggleFav(b.name);
        };

        grid.appendChild(div);
    });
}

render(brawlers);

/* 🔍 SEARCH */
searchInput.addEventListener("input", e => {
    const value = e.target.value.toLowerCase();

    const filtered = brawlers.filter(b =>
        b.name.toLowerCase().includes(value)
    );

    render(filtered);
});

</script>
