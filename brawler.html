<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawler</title>

<link rel="stylesheet" href="style.css">

<style>
.img{
    width:240px;
    height:240px;
    object-fit:contain;
    margin:20px auto;
    filter:drop-shadow(0 0 10px rgba(0,0,0,0.4));
}

.cardGlow{
    box-shadow:0 0 20px rgba(255,255,255,0.2);
}
</style>

</head>

<body>

<div class="card cardGlow">

<h1 id="name"></h1>

<img id="img" class="img">

<p id="rarity"></p>
<p id="hp"></p>
<p id="damage"></p>
<p id="type"></p>
<p id="desc"></p>

<button class="btn yes" onclick="history.back()">⬅ Tilbake</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const name = params.get("name");

document.getElementById("name").innerText = name;

/* 🔥 FULL DATA */
const data = {
"Shelly": {rarity:"Common",hp:3800,damage:504,type:"Damage",desc:"Start brawler",img:"images/shelly.png"},
"Colt": {rarity:"Common",hp:2800,damage:300,type:"Sharpshooter",desc:"Rask skyter",img:"images/colt.png"},
"Bull": {rarity:"Rare",hp:5200,damage:800,type:"Tank",desc:"Nærkamp monster",img:"images/bull.png"},
"Spike": {rarity:"Legendary",hp:2400,damage:560,type:"Control",desc:"Eksplosive kaktuser",img:"images/spike.png"},
"Edgar": {rarity:"Mythic",hp:3000,damage:600,type:"Assassin",desc:"Hopper og healer",img:"images/edgar.png"}
};

const b = data[name];

if(b){
    document.getElementById("img").src = b.img;
    document.getElementById("rarity").innerText = "Rarity: " + b.rarity;
    document.getElementById("hp").innerText = "HP: " + b.hp;
    document.getElementById("damage").innerText = "Damage: " + b.damage;
    document.getElementById("type").innerText = "Type: " + b.type;
    document.getElementById("desc").innerText = b.desc;
}

</script>

</body>
</html>
