<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawler</title>

<link rel="stylesheet" href="style.css">

<style>
.brawler-img{
    width:200px;
    height:200px;
    object-fit:contain;
    margin:20px 0;
}

.info-box{
    margin-top:10px;
}
</style>

</head>

<body>

<div class="card">

<h1 id="name">Laster...</h1>

<img id="image" class="brawler-img" src="" alt="brawler">

<div class="info-box">
<p id="info">Laster info...</p>
</div>

<button class="btn yes" onclick="history.back()">
⬅ Tilbake
</button>

</div>

<script>

// Hent navn fra URL
const params = new URLSearchParams(window.location.search);
const name = params.get("name");

document.getElementById("name").innerText = name;

// 🔥 BILDE MAP (kobler navn → bilde)
const images = {
    "Shelly":"images/shelly.png",
    "Colt":"images/colt.png",
    "Bull":"images/bull.png",
    "Spike":"images/spike.png",
    "Edgar":"images/edgar.png"
};

// 📌 INFO MAP
const info = {
    "Shelly":"Start brawler med shotgun.",
    "Colt":"Rask skytter med høy damage.",
    "Bull":"Tank som gjør mye skade på nært hold.",
    "Spike":"Legendary cactus med eksplosiv skade.",
    "Edgar":"Rask assassin som hopper på fiender."
};

// Sett bilde (eller fallback)
document.getElementById("image").src =
images[name] || "images/default.png";

// Sett info
document.getElementById("info").innerText =
info[name] || "Ingen info lagt til enda.";

</script>

</body>
</html>
