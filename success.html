<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bekreftet</title>
<link rel="stylesheet" href="style.css">

<style>
.comment-box {
    margin-top: 20px;
}

textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    resize: none;
    font-family: Arial;
}

button {
    margin-top: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

#info p {
    margin: 8px 0;
}
</style>
</head>

<body>

<div class="card">
    <h1>🎉 Booking bekreftet!</h1>

    <div id="info"></div>

    <h2>🎮 Ses snart på Brawl Stars! 😎</h2>

    <!-- KOMMENTAR -->
    <div class="comment-box">
        <h3>💬 Skriv en kommentar</h3>

        <textarea id="comment" placeholder="Skriv kommentaren din her..."></textarea>

        <button onclick="sendComment()">Send</button>

        <p id="savedComment"></p>

        <div id="allComments"></div>
    </div>
</div>

<script>
const dato = localStorage.getItem("dato");
const fornavn = localStorage.getItem("fornavn");
const etternavn = localStorage.getItem("etternavn");
const pakke = localStorage.getItem("pakke");
const kommentar = localStorage.getItem("kommentar");

document.getElementById("info").innerHTML = `
    <p><strong>Dato:</strong> ${dato}</p>
    <p><strong>Pakke:</strong> ${pakke}</p>
    <p><strong>Navn:</strong> ${fornavn} ${etternavn}</p>
`;

if (kommentar) {
    document.getElementById("savedComment").innerHTML =
        "💬 Din kommentar: " + kommentar;
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHX67rTBwkGH7vDVYL39Jth2wDegWcfRE",
  authDomain: "brawlstarsbooking-4c1b6.firebaseapp.com",
  databaseURL: "https://brawlstarsbooking-4c1b6-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "brawlstarsbooking-4c1b6",
  storageBucket: "brawlstarsbooking-4c1b6.firebasestorage.app",
  messagingSenderId: "228750608790",
  appId: "1:228750608790:web:d63e93ec3cc23a2e36f5b7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendComment = function () {
    const comment = document.getElementById("comment").value;

    if (!comment) {
        alert("Skriv en kommentar først!");
        return;
    }

    localStorage.setItem("kommentar", comment);

    push(ref(db, "comments"), {
        text: comment,
        navn: (localStorage.getItem("fornavn") || "") + " " +
              (localStorage.getItem("etternavn") || ""),
        dato: new Date().toLocaleString("no-NO")
    });

    document.getElementById("savedComment").innerHTML =
        "💬 Din kommentar: " + comment;

    document.getElementById("comment").value = "";

    alert("✅ Kommentar sendt!");
};



let xp = parseInt(localStorage.getItem("xp") || "0");

// gi XP hver gang success åpnes
xp += 20;
localStorage.setItem("xp", xp);

// popup
const popup = document.createElement("div");
popup.innerText = "+20 XP";
popup.style.position = "fixed";
popup.style.top = "20px";
popup.style.left = "50%";
popup.style.transform = "translateX(-50%)";
popup.style.background = "#22c55e";
popup.style.color = "white";
popup.style.padding = "12px 20px";
popup.style.borderRadius = "12px";
popup.style.fontWeight = "bold";
popup.style.zIndex = "9999";
popup.style.boxShadow = "0 10px 30px rgba(0,0,0,0.3)";

document.body.appendChild(popup);

setTimeout(() => popup.remove(), 2000);



const box = document.createElement("div");
document.getElementById("allComments").appendChild(box);

onValue(ref(db, "comments"), (snapshot) => {
    const data = snapshot.val();

    box.innerHTML = "<h3>💬 Alle kommentarer</h3>";

    if (data) {
        Object.values(data).forEach(c => {
            box.innerHTML += `
                <div style="background:#f3f4f6;margin-top:10px;padding:10px;border-radius:10px;">
                    <b>${c.navn}</b><br>
                    ${c.text}<br>
                    <small>${c.dato}</small>
                </div>
            `;
        });
    }
});
</script>

</body>
</html>
