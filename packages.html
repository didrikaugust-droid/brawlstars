<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velg pakke</title>
<link rel="stylesheet" href="style.css">

<style>
.packages{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.package{
    padding:25px;
    border-radius:20px;
    color:white;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.standard{
    background:#6b7280;
}

.gold{
    background:linear-gradient(135deg,#FFD700,#E6B800);
    color:black;
}

.premium{
    background:linear-gradient(135deg,#7c3aed,#c084fc);
}

.package h2{
    margin-bottom:10px;
}

.package p{
    margin:10px 0;
}

.select-btn{
    margin-top:15px;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

    <h1>🎮 Velg pakke</h1>
    <p>Velg pakken som passer deg best.</p>

    <div class="packages">

        <div class="package standard">
            <h2>Standard</h2>
            <p>10 runder</p>
            <button class="select-btn" onclick="choosePackage('Standard - 10 runder')">
                Velg
            </button>
        </div>

        <div class="package gold">
            <h2>Gull</h2>
            <p>15 runder</p>
            <button class="select-btn" onclick="choosePackage('Gull - 15 runder')">
                Velg
            </button>
        </div>

        <div class="package premium">
            <h2>Premium</h2>
            <p>30 runder</p>
            <button class="select-btn" onclick="choosePackage('Premium - 30 runder')">
                Velg
            </button>
        </div>

    </div>

</div>

<script>
function choosePackage(pkg){
    localStorage.setItem("pakke", pkg);
    window.location.href = "details.html";
}
</script>

</body>
</html>
