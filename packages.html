<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velg pakke</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111827,#1f2937);
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    width:100%;
    max-width:1000px;
    text-align:center;
}

.packages{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.package{
    border-radius:20px;
    padding:30px;
    color:white;
    transition:.3s;
}

.package:hover{
    transform:translateY(-8px);
}

.standard{
    background:#6b7280;
}

.gold{
    background:linear-gradient(135deg,#FFD700,#D4AF37);
    color:black;
}

.premium{
    background:linear-gradient(135deg,#7c3aed,#3b82f6);
}

button{
    margin-top:20px;
    border:none;
    padding:12px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

<h1>🏆 Velg pakke</h1>
<p>Velg hvor mange runder du ønsker.</p>

<div class="packages">

<div class="package standard">
<h2>Standard</h2>
<h3>10 runder</h3>
<p>Perfekt for en vanlig spilløkt.</p>

<button onclick="choosePackage('Standard - 10 runder')">
Velg
</button>
</div>

<div class="package gold">
<h2>Gull</h2>
<h3>15 runder</h3>
<p>Mer action og flere kamper.</p>

<button onclick="choosePackage('Gull - 15 runder')">
Velg
</button>
</div>

<div class="package premium">
<h2>Premium</h2>
<h3>30 runder</h3>
<p>For ekte Brawl Stars-legender.</p>

<button onclick="choosePackage('Premium - 30 runder')">
Velg
</button>
</div>

</div>

</div>

<script>
function choosePackage(pkg){
    localStorage.setItem("pakke", pkg);
    window.location.href = "details.html";
}
</script>

</body>
</html>
